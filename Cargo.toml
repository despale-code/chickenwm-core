[package]
name = "chickenwm-core"
version = "0.2.0"
edition = "2024"
authors = ["ChickenWM Contributors"]
license = "MIT"
repository = "https://github.com/despale-code/chickenwm-core"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = { version = "1.0" }
thiserror = { version = "2.0" }
winnow = { version = "0.7" }
notify = { version = "8.0" }
dirs = { version = "6.0" }
parking_lot = { version = "0.12" }
crossbeam-channel = { version = "0.5" }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Com", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_UI_Controls"] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
regex = "1"
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui_kittest = { version = "0.31", optional = true, features = ["wgpu", "eframe"] }

[features]
egui = ["dep:egui"]
# `--render-to <png>`: run an egui app headless and save one frame (no window, no focus).
headless = ["egui", "dep:eframe", "dep:egui_kittest"]
